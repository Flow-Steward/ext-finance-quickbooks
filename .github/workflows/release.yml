name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag matching extension.yaml
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: Flow-Steward/extensions/.github/workflows/release-extension.yml@52b0dca15912610fb8ef1908a1d46b9761952f2d
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
