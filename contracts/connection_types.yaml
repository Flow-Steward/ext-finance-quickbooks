{
  "connection_types": [
    {
      "connection_type_id": "quickbooks_company",
      "display_name": "QuickBooks Online company",
      "description": "One explicitly selected company. Enter its Company ID (realm ID) before connecting.",
      "auth": {
        "type": "oauth2",
        "provider_id": "intuit_oauth",
        "scopes": {
          "required": [
            "com.intuit.quickbooks.accounting"
          ],
          "optional": []
        }
      },
      "config_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "realm_id"
        ],
        "properties": {
          "realm_id": {
            "type": "string",
            "pattern": "^[0-9]{1,32}$"
          },
          "environment": {
            "type": "string",
            "enum": [
              "sandbox",
              "production"
            ],
            "default": "sandbox"
          },
          "minor_version": {
            "type": "integer",
            "minimum": 75,
            "maximum": 999,
            "default": 75
          },
          "allow_create": {
            "type": "boolean",
            "default": true
          },
          "allow_update": {
            "type": "boolean",
            "default": true
          },
          "allow_delete": {
            "type": "boolean",
            "default": true
          },
          "request_timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 60,
            "default": 30
          }
        }
      },
      "secret_schema": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "access_token": {
            "type": "string"
          }
        }
      },
      "capabilities": [
        "create_account",
