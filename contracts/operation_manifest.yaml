{
  "operations": [
    {
      "operation_id": "create_account",
      "display_name": "Create account",
      "description": "Create an account in the selected company using a native QuickBooks JSON object. Include its required provider fields; omit Id and SyncToken. Returns the saved record in data.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "quickbooks_company"
      ],
      "category": "accounting",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "QuickBooks company"
        },
        {
          "name": "data",
          "value_type": "json",
          "required": true,
          "display_name": "Data (QuickBooks JSON)",
          "schema": {
            "type": "object",
            "description": "A nonempty native QuickBooks object. Include required fields for this entity. Do not supply Id or SyncToken when creating a record."
          }
        }
      ],
      "outputs": [
        {
          "name": "data",
          "value_type": "json"
        }
      ],
      "result_fields": [
        "result.data"
      ],
      "error_codes": [
        "invalid_payload",
