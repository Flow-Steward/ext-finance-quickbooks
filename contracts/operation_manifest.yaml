    {
      "operation_id": "create_attachable",
      "display_name": "Create attachment or upload a file",
      "description": "Create QuickBooks attachment metadata from Data. With Workflow file handle, upload that file and associate it using the supplied AttachableRef metadata; without a file, create metadata only.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "quickbooks_company"
      ],
      "category": "accounting",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "QuickBooks company"
        },
        {
          "name": "data",
          "value_type": "json",
          "required": true,
          "display_name": "Data (QuickBooks JSON)",
          "schema": {
            "type": "object",
            "description": "Attachment metadata using native QuickBooks fields. For upload, include FileName, a supported ContentType (for example application/pdf) and AttachableRef links; omit Id and SyncToken."
          }
        },
        {
          "name": "artifact_handle",
          "value_type": "artifact_handle",
          "required": false,
          "display_name": "Workflow file handle",
          "schema": {
            "type": "string",
            "description": "Optional file handle returned by an earlier workflow step. With a file, Data supplies QuickBooks attachment metadata; leave empty for metadata only."
          }
        }
      ],
      "outputs": [
        {
          "name": "data",
          "value_type": "json"
        }
      ],
      "result_fields": [
        "result.data"
      ],
      "error_codes": [
